# preferred: Registry-level default. `driver` is required, `model` is optional.
# Without `preferred`, the first driver listed under `drivers:` is preferred
# and the model is `auto`. The preferred driver breaks the tie when several
# drivers list a requested model. The pair is the fallback used when a profile
# has no `profiles:` entry, or its entry fails to resolve (unless fallbackMode
# is 'fail-fast'). A profile's own entry is always tried first. If the preferred
# driver cannot be used, or does not list the preferred model, the service
# still starts and logs a warning; the same rules then pick the driver and
# model that are used instead.
preferred:
  driver: kiro
  model: claude-sonnet-5.5

# profiles: Per-profile model/driver preference. A key is a canonical profile
# name, spelled and capitalized as in .workflow/rules/_PROFILES.md. An alias
# (PE) is never a key, and a key that is not a canonical name has no effect;
# the service logs a warning for it at startup. `model` is required.
# `driver` is optional; when omitted, resolution falls back to registry
# order (then the preferred driver as tie-break) for that model. A chat
# takes the entry when the profile is activated.
profiles:
  Architect:
    model: claude-opus-5.5
    driver: kiro
  Analyst:
    model: claude-opus-5.5
  Operator:
    model: claude-haiku-4.5
  Planner:
    model: claude-sonnet-5.5
  TestDesigner:
    model: claude-sonnet-5.5
  PromptEngineer:
    model: claude-haiku-4.5
  Builder:
    model: claude-sonnet-5.5
  Documentor:
    model: claude-haiku-4.5
  Communicator:
    model: claude-haiku-4.5

# fallbackMode: System-level setting (applies to all profiles, not
# per-profile) controlling what happens when a profile's own model/driver
# preference fails to resolve. 'fallback-to-default-driver' (default)
# falls through to `preferred` above. 'fail-fast' does not: a driver the
# registry does not list, or a model no driver lists, fails the prompt with
# an error that names the profile. A driver that is listed but lacks the
# model, while another driver lists it, is still substituted (same model,
# other driver). In both modes the chat shows a line when a profile did not
# get the driver or model it asked for. See docs/dev/acp (model dispatch)
# for the full fallback chain.
fallbackMode: fallback-to-default-driver

# drivers: One entry per driver. `module` is the file that provides the
# driver (it exports a `createDriver` factory). A relative path is read
# from this file's folder; an absolute path also works. A TypeScript source
# file is named with a `.js` suffix, as in the source's imports.
drivers:
  kiro:
    module: ./kiro-driver-acp.js
    models:
      - auto
      - claude-opus-5.5
      - claude-sonnet-5.5
      - claude-opus-5
      - claude-sonnet-5
      - claude-opus-4.8
      - gpt-5.6-sol
      - gpt-5.6-terra
      - gpt-5.6-luna
      - claude-opus-4.7
      - claude-opus-4.6
      - claude-sonnet-4.6
      - claude-opus-4.5
      - claude-sonnet-4.5
      - claude-sonnet-4
      - claude-haiku-4.5
      - deepseek-3.2
      - minimax-m2.5
      - minimax-m2.1
      - glm-5
      - qwen3-coder-next

  copilot:
    module: ./copilot-driver-acp.js
    models:
      - auto
      - claude-sonnet-5
      - claude-fable-5.1
      - claude-fable-5
      - claude-opus-5
      - claude-opus-4.8
      - claude-opus-4.8-fast
      - claude-opus-4.7
      - claude-sonnet-4.6
      - claude-haiku-4.5
      - gpt-6-astra
      - gpt-5.6-sol
      - gpt-5.6-terra
      - gpt-5.6-luna
      - gpt-5.5
      - gpt-5.4
      - gpt-5.4-mini
      - gpt-5.3-codex
      - gpt-5-mini
      - mai-code-1.1-flash
      - gemini-3.8-flash
      - gemini-3.7-flash
      - gemini-3.6-flash
      - gemini-3.5-flash
      - grok-4.5
      - kimi-k3
      - kimi-k2.7-code

  # Example custom driver, shown as a comment so it is not loaded.
  # Implement the driver, export `createDriver`, point `module` at the
  # file, and uncomment the entry.
  #
  # my-local-model:
  #   module: ./my-local-model-driver.js
  #   models:
  #     - llama-3.2-local
  #     - mistral-7b-local
